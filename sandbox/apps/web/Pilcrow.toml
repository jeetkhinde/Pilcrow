[web]
host = "127.0.0.1"
port = 3000

# ── Fragment directories ─────────────────────────────────────────────────────
# Each entry is a directory of URL-accessible HTML fragments.
# The `dir` key is relative to `src/`. The URL prefix defaults to the dir name.
#
# [[fragments]]
# dir = "widgets"           # → /widgets/**
#
# [[fragments]]
# dir = "ui-blocks"
# url = "blocks"            # → /blocks/** (explicit override)

[[fragments]]
dir = "widgets"

[routing]
ignore_directories = ["Cards"]
