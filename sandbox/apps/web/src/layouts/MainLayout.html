---
import Nav from "components/Nav.html";

pub struct Props {
    pub title: String,
}
---
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
        h1 { font-size: 2rem; }
        nav a { margin-right: 1rem; }
    </style>
</head>
<body>
    <Nav />
    <slot />
    <script src="{{ pilcrow_web::assets::assets::silcrow_js_path() }}" defer></script>
</body>
</html>
