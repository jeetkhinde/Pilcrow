---
import MainLayout from "layouts/MainLayout.html";

pub struct Props {
pub title: String,
pub message: String,
}

pub async fn load(_client: PilcrowClient) -> AppResult<Props> {
    let data = crate::api::index::fetch();
    Ok(Props {
    title: data.title,
    message: data.message,
    })}
    ---
    <MainLayout title={title.clone()}>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
    </MainLayout>
