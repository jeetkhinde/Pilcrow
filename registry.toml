registry_schema_version = 1
framework_version = "0.1.0"

[[features]]
id = "ssr-pages"
name = "SSR Pages"
domain = "pilcrow"
status = "stable"
summary = "Server-rendered pages are discovered from src/pages/**/*.html with optional Rust code-behind."
spec = "A page is an HTML template under src/pages. A sibling .rs file may declare Props and an async load(req: Req) -> AppResult<Props> function. Pages are registered by generated code through pilcrow_web::include_generated_app!()."
canonical_usage = "Create src/pages/products/index.html and src/pages/products/index.rs. In index.rs: `pub struct Props { pub items: Vec<String> }` and `pub async fn load(_req: Req) -> AppResult<Props> { Ok(Props { items: vec![] }) }`. Access in template: `{{ items }}`."
constraints = [
  "Page .html files must live under src/pages/.",
  "Code-behind load() must be async, return AppResult<Props>, and accept Req.",
  "Props must be a public struct named Props.",
  "Do not call pilcrow_web::include_generated_app!() manually — the pilcrow_app!() macro does it.",
]
invalid_examples = [
  "fn load() -> Props — missing async, wrong return type",
  "pub async fn load() -> AppResult<Props> — missing Req argument",
  "Manually registering a page route in main.rs with .route()",
]
source_refs = [
  "crates/routekit/src/templating/codegen/page_routes.rs",
  "crates/routekit/src/templating/codegen/instrument.rs",
  "crates/web/src/lib.rs",
]
test_refs = [
  "crates/routekit/src/templating/codegen/tests.rs",
  "sandbox/apps/web/src/pages/index.rs",
]
validation_rules = [
  "Pages should not manually register Axum routes.",
  "Code-behind load functions should be async and return AppResult<Props>.",
]
scaffold_templates = ["route"]

[[features]]
id = "file-routing"
name = "File Routing"
domain = "pilcrow"
status = "stable"
summary = "Route paths are derived from files and directories under src/pages and src/api."
spec = "index.html maps to its containing directory, dynamic segments use bracket syntax [param], route groups use parenthesized directories (group), and generated route helpers live in OUT_DIR."
canonical_usage = "src/pages/index.html -> GET /. src/pages/products/index.html -> GET /products. src/pages/[id]/index.html -> GET /:id. src/pages/(admin)/dashboard.html -> GET /dashboard (group stripped). src/pages/[id=integer]/index.html -> GET /:id with integer constraint."
constraints = [
  "Page routes must live under src/pages.",
  "API routes must live under src/api.",
  "Dynamic params use [name] syntax; constraint matchers use [name=matcher] syntax.",
  "Route groups use (name) syntax — strips the name from the URL.",
  "index.html in a directory maps to the directory path.",
]
invalid_examples = [
  "Registering routes in main.rs with .route() or Router::new()",
  "Using :param syntax in file names — that is axum runtime notation; file names use [param]",
