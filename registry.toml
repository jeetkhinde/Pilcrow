[[features]]
id = "ssg"
name = "Static Site Generation (SSG)"
domain = "pilcrow"
status = "stable"
summary = "Startup-prerender SSG: pages with pub const PRERENDER: bool = true are rendered once at server startup and served from cache on all subsequent requests."
spec = """
SSG is implemented as of 2026-04-24 (startup-prerender model).

When PRERENDER = true is declared in a code-behind file that also has load(), routekit generates:
1. A handler that checks the ISR cache first (keyed by req.path). Cache hit → return immediately.
   Cache miss (startup race) → run load chain, render, store with u64::MAX TTL, return response.
2. A __pilcrow_prerender_all(cache) function called at server startup (before accepting connections)
   that pre-warms the cache for every PRERENDER page.

For dynamic routes (patterns with :param segments), an entries() function is required:
  pub async fn entries() -> Vec<HashMap<String, String>>
  Returns the list of path-param combinations to pre-render at startup.

User API:
  pub const PRERENDER: bool = true;                           — opt in
  pub async fn entries() -> Vec<HashMap<String, String>> { } — required for dynamic routes

Use pilcrow_start(pilcrow_router()).await instead of pilcrow_web::start(pilcrow_router()).await
to trigger the startup prerender. pilcrow_start is generated by pilcrow_app!().

PRERENDER and REVALIDATE are mutually exclusive — use one or the other.
PRERENDER is a no-op for pages without load() (already static via Props::default()).
PRERENDER is a no-op for pages with Deferred<T> or DeferredHtml fields (streaming not supported).

All PRERENDER constants are stripped from the emitted module — never appear in generated Rust.
"""
canonical_usage = """
// Static route — src/pages/about.rs
pub const PRERENDER: bool = true;
pub struct Props { pub title: String }
pub async fn load(_req: Req) -> AppResult<Props> {
    Ok(Props { title: "About Us".to_string() })
}

// Dynamic route — src/pages/products/[id].rs
pub const PRERENDER: bool = true;
pub struct Props { pub product: Product }
pub async fn entries() -> Vec<HashMap<String, String>> {
    db::all_product_ids().await.into_iter()
        .map(|id| [("id".to_string(), id.to_string())].into())
        .collect()
}
pub async fn load(req: Req) -> AppResult<Props> {
    let id = req.params.get("id").unwrap();
    Ok(Props { product: db::find(id).await? })
}

// main.rs — use pilcrow_start instead of start
pilcrow_app!();
#[tokio::main]
async fn main() {
    pilcrow_start(pilcrow_router()).await
}
"""
constraints = [
  "PRERENDER requires a load() fn to do anything — pages without load() are already static.",
  "PRERENDER is incompatible with REVALIDATE — build panics if both are declared.",
  "Dynamic routes (pattern contains :param) with PRERENDER require an entries() function — build panics otherwise.",
